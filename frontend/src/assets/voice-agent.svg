<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#AA3BFF" stop-opacity="0.28" />
      <stop offset="55%" stop-color="#6366F1" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#AA3BFF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="28" y1="28" x2="152" y2="152" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#AA3BFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="56" y1="46" x2="124" y2="134" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#AA3BFF" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="62" y1="90" x2="118" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5F3FF" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E9D5FF" />
    </linearGradient>
    <filter id="softShadow" x="30" y="34" width="120" height="120" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#AA3BFF" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Ambient radial glow -->
  <circle cx="90" cy="90" r="82" fill="url(#bgGlow)" />

  <!-- Outer acoustic orbit rings -->
  <circle cx="90" cy="90" r="66" stroke="url(#ringGrad)" stroke-width="1.25" stroke-dasharray="4 6" />
  <circle cx="90" cy="90" r="52" stroke="url(#ringGrad)" stroke-width="1.25" opacity="0.65" />

  <!-- Orbiting AI signal nodes -->
  <circle cx="145" cy="54" r="4" fill="#C084FC" />
  <circle cx="145" cy="54" r="7.5" stroke="#C084FC" stroke-opacity="0.35" stroke-width="1.2" />
  <circle cx="34" cy="122" r="3" fill="#6366F1" />
  <circle cx="128" cy="146" r="2.5" fill="#AA3BFF" opacity="0.8" />

  <!-- Main central badge -->
  <g filter="url(#softShadow)">
    <rect x="48" y="48" width="84" height="84" rx="26" fill="url(#coreGrad)" />
    <rect x="48.75" y="48.75" width="82.5" height="82.5" rx="25.25" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.5" />
  </g>

  <!-- Inner voice waveform bars -->
  <rect x="65" y="82" width="5" height="16" rx="2.5" fill="url(#waveGrad)" opacity="0.85" />
  <rect x="75" y="71" width="5.5" height="38" rx="2.75" fill="url(#waveGrad)" />
  <rect x="87.25" y="63" width="5.5" height="54" rx="2.75" fill="#FFFFFF" />
  <rect x="99.5" y="73" width="5.5" height="34" rx="2.75" fill="url(#waveGrad)" />
  <rect x="110" y="81" width="5" height="18" rx="2.5" fill="url(#waveGrad)" opacity="0.85" />

  <!-- Subtle AI spark -->
  <path d="M120 58L121.6 62.4L126 64L121.6 65.6L120 70L118.4 65.6L114 64L118.4 62.4L120 58Z" fill="#FFFFFF" opacity="0.9" />
</svg>

